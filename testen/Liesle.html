<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LIESLE AI Effect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* Background glow */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
    }

    .glow1 {
      width: 500px;
      height: 500px;
      background: rgba(255, 0, 255, 0.2);
      animation: float1 6s infinite ease-in-out;
    }

    .glow2 {
      width: 400px;
      height: 400px;
      background: rgba(0, 255, 255, 0.2);
      animation: float2 8s infinite ease-in-out;
    }

    /* Main text */
    .glitch {
      position: relative;
      color: white;
      font-size: 8rem;
      font-weight: 900;
      letter-spacing: 15px;
      text-transform: uppercase;

      text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px magenta,
        0 0 80px magenta;

      animation: flicker 3s infinite;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .glitch::before {
      color: cyan;
      z-index: -1;
      animation: glitchTop 1.5s infinite linear alternate-reverse;
    }

    .glitch::after {
      color: magenta;
      z-index: -2;
      animation: glitchBottom 1.2s infinite linear alternate-reverse;
    }

    /* Subtitle */
    .subtitle {
      text-align: center;
      margin-top: 20px;
      color: cyan;
      letter-spacing: 8px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    /* Animations */

    @keyframes glitchTop {
      0% { transform: translate(0); }
      20% { transform: translate(-4px, -4px); }
      40% { transform: translate(4px, 4px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes glitchBottom {
      0% { transform: translate(0); }
      20% { transform: translate(4px, 2px); }
      40% { transform: translate(-4px, -2px); }
      60% { transform: translate(2px, -4px); }
      80% { transform: translate(-2px, 4px); }
      100% { transform: translate(0); }
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
      }

      20%, 24%, 55% {
        opacity: 0.5;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes float1 {
      0%, 100% {
        transform: translate(-50px, -30px);
      }

      50% {
        transform: translate(50px, 30px);
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translate(40px, 20px);
      }

      50% {
        transform: translate(-40px, -20px);
      }
    }

  </style>
</head>

<body>

  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div>
    <h1 class="glitch" data-text="LIESLE">
      LIESLE
    </h1>

    <div class="subtitle">
      AI GENERATED IDENTITY
    </div>
  </div>

</body>
</html>
